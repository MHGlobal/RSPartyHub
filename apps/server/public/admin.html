<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — RS Party Hub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="topbar">
    <div class="brand">RS <span>Party Hub</span> — Admin</div>
    <div class="conn-badge ok">local</div>
    <div class="admin-area" id="admin-area">
      <!-- Login form or session status will be injected here by JS -->
    </div>
  </nav>
  <main class="wrap">
    <section class="card" id="admin-panel">
      <!-- Panel content injected by JS -->
    </section>
  </main>

  <script type="module">
    import { el, h } from "/js/client.js";
    const panel = el("admin-panel");
    const adminArea = el("admin-area");

    let loggedIn = false;

    // Check for existing session on load
    async function checkSession() {
      const res = await fetch("/api/admin/overview", { credentials: "include" });
      if (res.ok) {
        loggedIn = true;
        renderLoggedIn();
        load();
      } else {
        loggedIn = false;
        renderLogin();
      }
    }

    function renderLogin() {
      adminArea.innerHTML = `
        <div class="field">
          <label class="lbl" for="pin">PIN de administrador</label>
          <input id="pin" class="input" type="password" placeholder="4 dígitos" />
        </div>
        <button class="btn primary" id="btn-login">Entrar</button>
        <div id="login-error" class="hint" style="margin-top:8px; color:var(--err);"></div>
      `;
      el("btn-login").addEventListener("click", login);
      el("pin").addEventListener("keydown", (e) => e.key === "Enter" && login());
    }

    function renderLoggedIn() {
      adminArea.innerHTML = `
        <div class="field">
          <span class="lbl">Logado como admin</span>
        </div>
        <button class="btn dangerous" id="btn-logout">Logout</button>
        <span class="hint" style="margin-left:12px;">(x-token ainda funciona para automação)</span>
      `;
      el("btn-logout").addEventListener("click", logout);
      // Re-render panel after login
      load();
    }

    async function login() {
      const pin = el("pin").value.trim();
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      if (res.ok) {
        renderLoggedIn();
      } else {
        el("login-error").textContent = data.error || "Login failed";
      }
    }

    async function logout() {
      await fetch("/api/admin/logout", {
        method: "POST",
        credentials: "include",
      });
      renderLogin();
      panel.innerHTML = "";
      loggedIn = false;
    }

    async function load() {
      if (!loggedIn) return;
      const res = await fetch("/api/admin/overview", { credentials: "include" });
      if (!res.ok) {
        // Session may have expired, re-show login
        renderLogin();
        return;
      }
      const data = await res.json();
      render(data);
    }

    function render(data) {
      panel.innerHTML = "";
      const sys = data.system;
      panel.append(h("section", { class: "card" },
        h("h2", {}, "Sistema"),
        h("p", {}, `Node ${sys.node} · RSS ${sys.rssMb} MB · heap ${sys.heapUsedMb} MB · uptime ${sys.uptimeSec}s`)));

      const rooms = data.rooms ?? [];
      panel.append(h("section", { class: "card" },
        h("h2", {}, `Salas ativas (${rooms.length})`),
        rooms.length
          ? h("table", { class: "score-table" },
              rooms.map(r => h("tr", {},
                h("td", {}, h("strong", {}, r.code)),
                h("td", {}, r.phase),
                h("td", {}, `${r.players} jogadores`),
                h("td", {}, r.currentGame ?? "—"),
                r.locked ? h("td", {}, "🔒") : h("td"))))
          : h("p", { class: "waiting-note" }, "Nenhuma sala ativa."));

      const audit = data.recentAudit ?? [];
      panel.append(h("section", { class: "card" },
        h("h2", {}, "Auditoria recente"),
        h("table", { class: "score-table" },
          audit.slice(0, 20).map(a => h("tr", {},
            h("td", { class: "rank" }, new Date(a.at).toLocaleTimeString()),
            h("td", {}, a.event_type),
            h("td", { class: "p-meta" }, a.category)))));
    }

    checkSession();
  </script>
</body>
</html>
